<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de números</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <div class="container">
        <h1>Verificador de Números</h1>
        <form id="form-verify">
            <input type="number" id="numberA" required placeholder="Digite um número">
            <input type="number" id="numberB" required placeholder="Digite outro número">
            <button type="submit" id="btn-verificar">VERIFICAR</button>
            <div class="message">
                <div class="error-message">⚠️ Por favor, preencha os dois números corretamente.</div>
                <div class="success-message"></div>
            </div>
        </form>
    </div>
    <script src="script.js"></script>
</body>
</html>
